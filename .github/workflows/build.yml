name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python reference dependencies
        run: pip install numpy scipy soundfile

      - name: Simulated rig — Python reference (known answers)
        working-directory: reference
        run: python sim_test.py

      - name: Page DSP (dsp.js) vs Python
        working-directory: reference/web
        run: node test_dsp.js ../sim_out

      - name: NAM prep simulated rig — Python reference (known answers)
        working-directory: reference
        run: python sim_nam_test.py

      - name: Page NAM prep (nam.js) vs Python
        working-directory: reference/web
        run: node --max-old-space-size=6144 test_nam.js ../sim_nam_out/gold

      - name: Page click-through in a simulated browser (NAM steps)
        working-directory: reference/web
        run: |
          python build.py
          npm install --no-save --silent jsdom@24.1.3
          node --max-old-space-size=8192 dom_test_nam.js ../sim_nam_out/gold

      - name: Build (universal, release)
        run: |
          set -o pipefail
          if ! swift build -c release --arch arm64 --arch x86_64 2>&1 | tee build.log; then
            # Surface compiler errors as one annotation (readable from the API without log access).
            msg="$(grep -E 'error:' build.log | sed -E 's#^.*/Sources/#Sources/#' | sort -u | head -40 | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Swift build failed::${msg}"
            exit 1
          fi

      - name: Unit tests
        run: swift test

      - name: Golden test — Swift DSP vs Python reference
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          python reference/compare_swift.py "$BIN/ircapture-cli" reference/sim_out
          python reference/compare_swift_nam.py "$BIN/ircapture-cli" reference/sim_nam_out/gold

      - name: Make the app
        run: scripts/make_app.sh "${{ github.run_number }}"

      - name: Smoke test — launch the app, process the simulated Logic recordings in it
        run: |
          set -x
          EXE="dist/IR Capture.app/Contents/MacOS/IR Capture"
          OUT="$(python -c 'import tempfile;print(tempfile.gettempdir())')/IRCaptureDemo/demo"
          "$EXE" --demo "$PWD/reference/sim_out" & PID=$!
          for i in $(seq 1 60); do [ -f "$OUT/report.json" ] && break; sleep 1; done
          sleep 3
          kill -0 $PID || { echo "::error title=Smoke test::The app quit or crashed during the demo run"; exit 1; }
          screencapture -x dist/screenshot-results.png || echo "screenshot failed"
          kill $PID; sleep 1
          [ -f "$OUT/report.json" ] || { echo "::error title=Smoke test::The app didn't write report.json"; exit 1; }
          python reference/check_app_demo.py "$OUT" reference/sim_out
          NAMOUT="$(python -c 'import tempfile;print(tempfile.gettempdir())')/IRCaptureDemo/namdemo"
          "$EXE" --nam-demo "$PWD/reference/sim_nam_out/gold" & PID=$!
          for i in $(seq 1 120); do [ -f "$NAMOUT/UPLOAD-STEPS.txt" ] && break; sleep 1; done
          sleep 3
          kill -0 $PID || { echo "::error title=Smoke test::The app quit or crashed during the NAM demo run"; exit 1; }
          screencapture -x dist/screenshot-nam.png || echo "screenshot failed"
          kill $PID; sleep 1
          [ -f "$NAMOUT/report.json" ] || { echo "::error title=Smoke test::The app didn't write the NAM files"; exit 1; }
          python reference/compare_swift_nam.py --app "$NAMOUT" reference/sim_nam_out/gold
          DIROUT="$(python -c 'import tempfile;print(tempfile.gettempdir())')/IRCaptureDemo/namdirect"
          "$EXE" --nam-direct-demo "$PWD/reference/sim_nam_out" & PID=$!
          for i in $(seq 1 120); do [ -f "$DIROUT/UPLOAD-STEPS.txt" ] && break; sleep 1; done
          sleep 3
          kill -0 $PID || { echo "::error title=Smoke test::The app quit or crashed during the NAM direct-capture demo"; exit 1; }
          screencapture -x dist/screenshot-nam-record.png || echo "screenshot failed"
          kill $PID; sleep 1
          [ -f "$DIROUT/report.json" ] || { echo "::error title=Smoke test::The app didn't write the NAM direct-capture files"; exit 1; }
          python reference/check_app_nam_direct.py "$DIROUT" reference/sim_nam_out
          "$EXE" & PID=$!
          sleep 6
          kill -0 $PID || { echo "::error title=Smoke test::The app quit or crashed on a plain launch"; exit 1; }
          screencapture -x dist/screenshot-capture.png || echo "screenshot failed"
          kill $PID

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: IR-Capture-app
          path: dist/IR-Capture.zip

      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/IR-Capture.zip $(ls dist/screenshot-*.png 2>/dev/null) \
            --title "IR Capture — latest build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download IR-Capture.zip below, double-click to unzip, and move IR Capture to Applications. First launch: see the README." \
            --prerelease --target "$GITHUB_SHA"
